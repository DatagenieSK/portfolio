function useIn(){const r=useRef(),[v,s]=useState(false);useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){s(true);o.disconnect()}},{threshold:.15});o.observe(r.current);return()=>o.disconnect()},[]);return[r,v]}

function App(){
const[ld,setLd]=useState(0),[pc,setPc]=useState(0),[theme,setTheme]=useState(null),[act,setAct]=useState("about"),[prog,setProg]=useState(0),[f,setF]=useState("All"),[cp,setCp]=useState(false);
const NAV=[["about","About"],["work","Work"],["skills","Skills"],["contact","Contact"]];
useEffect(()=>{const b=document.getElementById("boot");if(b)b.remove();document.body.style.overflow="hidden";const t0=performance.now();let raf;const f=t=>{const p=Math.min((t-t0)/1500,1);setPc(Math.round((1-Math.pow(1-p,2))*100));if(p<1)raf=requestAnimationFrame(f);else{setLd(1);setTimeout(()=>{setLd(2);document.body.style.overflow=""},500)}};raf=requestAnimationFrame(f);return()=>cancelAnimationFrame(raf)},[]);
useEffect(()=>{const sc=()=>{const h=document.documentElement;setProg(scrollY/(h.scrollHeight-innerHeight)*100);let a="about";NAV.forEach(([id])=>{const e=document.getElementById(id);if(e&&e.getBoundingClientRect().top<innerHeight*.4)a=id});setAct(scrollY<300?"":a)};
const pm=e=>{const s=document.documentElement.style;s.setProperty("--cx",e.clientX+"px");s.setProperty("--cy",e.clientY+"px")};
addEventListener("scroll",sc,{passive:true});addEventListener("pointermove",pm);sc();return()=>{removeEventListener("scroll",sc);removeEventListener("pointermove",pm)}},[]);
const flip=()=>{const cur=theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";setTheme(n);document.documentElement.setAttribute("data-theme",n)};
const copy=async()=>{try{await navigator.clipboard.writeText(EM);setCp(true);setTimeout(()=>setCp(false),1800)}catch(e){location.href="mailto:"+EM}};
const tabs=["All","Data","Web","Android","AI & Python"],list=PR.filter(p=>f==="All"||p.c===f);
return html`<div>
${ld<2&&html`<${Loader} p=${pc} out=${ld===1}/>`}
<nav><div class="nin"><a class="logo" href="#top">sk.</a><ul>${NAV.map(([id,l])=>html`<li><a href=${"#"+id} class=${act===id?"on":""}>${l}</a></li>`)}<li><button class="tg" onClick=${flip} aria-label="Toggle theme">◐</button></li></ul></div><div class="bar" style=${{width:prog+"%"}}></div></nav>
<main class="wrap" id="top">
<section class="hero"><div class="badge"><i></i>Available for work</div>
<h1>Hi, I’m <em>Sk Alauddin</em></h1>
<p class="sub">CTO & co-founder at NovaOps, plus data analyst and web & app builder from Kolkata.</p>
<${Device}/>
<div class="hint">TAP THE KEYS · OR JUST TYPE</div>
<div class="cta"><a class="btn f" href=${"mailto:"+EM}>Start a project</a><a class="btn" href="#work">See my work</a></div></section>
<div class="mq"><div class="mt">${[...TECH,...TECH].map((t,i)=>html`<span key=${i}>${t}</span>`)}</div></div>
<div class="stats">${[[43,"","GitHub repositories"],[9,"","Web & app builds"],[6,"","Data projects"],[7,"","Certifications"]].map(([n,s,l],i)=>html`<${Rev} d=${i*80}><div class="stat"><b><${Count} to=${n} suf=${s}/></b><span>${l}</span></div><//>`)}</div>
<section class="sec" id="about"><${Rev}><h2>About</h2><p class="lead">Data analyst who turns raw sales and inventory data into clear decisions. I build Advanced Excel and Power BI dashboards, clean raw data with Power Query and write basic SQL. I also build websites and Android apps, and I’m CTO and co-founder of NovaOps.</p><//></section>
<section class="sec" id="work"><h2>Selected work</h2>
<div class="tabs">${tabs.map(t=>html`<button class=${"tab"+(f===t?" on":"")} onClick=${()=>setF(t)}>${t}<sup>${t==="All"?PR.length:PR.filter(p=>p.c===t).length}</sup></button>`)}</div>
<div class="grid" key=${f}>${list.map((p,i)=>html`<${Card} p=${p} i=${i} key=${p.t}/>`)}</div></section>
<section class="sec" id="skills"><${Rev}><h2>Skills</h2><div class="sk">${SK.map(([h,t])=>html`<div><h3>${h}</h3><p>${t}</p></div>`)}</div><ul class="ct">${CE.map(c=>html`<li>${c}</li>`)}</ul><//></section>
<section class="sec" id="contact"><${Rev}><h2>Contact</h2><p class="big">Let’s build something sharp.</p>
<div class="cta" style=${{justifyContent:"flex-start"}}><a class="btn f" href=${"mailto:"+EM}>Email me</a><button class="btn" onClick=${copy}>${cp?"Copied ✓":"Copy email"}</button><a class="btn" href="https://github.com/DatagenieSK" target="_blank" rel="noopener">GitHub</a><a class="btn" href="https://novaops.in" target="_blank" rel="noopener">NovaOps</a></div><//></section>
<div class="ft">© 2026 Sk Alauddin · Kolkata, India</div>
</main></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${EB}><${App}/><//>`);
</script>
</body>
</html>
